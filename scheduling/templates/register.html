{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:400px; margin:0 auto;">
  <h2 style="font-family:'Press Start 2P',monospace; font-size:0.75rem; color:#FFD700; margin-bottom:1.5rem; text-align:center;">
    🧑🔬 Nuevo Entrenador
  </h2>
  <form method="POST">
    {% csrf_token %}
    {% for field in form %}
      <div style="margin-bottom:1rem;">
        <label style="display:block; font-size:0.8rem; color:#aaa; margin-bottom:0.3rem;">
          {{ field.label }}
        </label>
        {{ field }}
        {% if field.errors %}
          <p style="color:#E53935; font-size:0.75rem; margin-top:0.3rem;">{{ field.errors|join:", " }}</p>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn" style="width:100%; text-align:center;">
      ¡Comenzar aventura!
    </button>
  </form>
  <p style="text-align:center; margin-top:1rem; font-size:0.8rem; color:#aaa;">
    ¿Ya tienes cuenta? <a href="{% url 'login' %}" style="color:#FFD700;">Inicia sesión</a>
  </p>
</div>
{% endblock %}
